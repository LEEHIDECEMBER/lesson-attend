<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="레슨 출석">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>레슨 출석</title>
<style>
:root{
  --bg:#F5F4F8;--card:#fff;--ink:#1E1B2E;--sub:#6E6A80;--faint:#A19DB0;--line:#ECEAF2;
  --acc:#6A4BE0;--acc-soft:#EFEBFD;--acc-ink:#4B30B8;
  --red:#E5484D;--red-soft:#FDECEC;--orange:#D9760A;--orange-soft:#FFF2E0;
  --green:#1F9D63;--green-soft:#E4F5EC;--blue:#2F7FD8;--blue-soft:#E8F1FC;--gray:#8A8798;--gray-soft:#F0EFF4;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(96px + var(--safe-b))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 12px}
.top h1{margin:0;font-size:26px;letter-spacing:-.5px}
.top .sub{margin:0;color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,27,46,.04)}
.card h3,.sec-h{margin:0 0 10px;font-size:15px;font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px;font-size:14px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.faint{color:var(--faint);font-size:12px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:8px 0 0}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
input[type=text],input[type=password],input[type=date],input[type=number],input:not([type]),textarea,select{
  width:100%;border:1px solid var(--line);background:#FBFAFD;border-radius:12px;padding:12px 13px;outline:none;font-size:16px}
input:focus,textarea:focus{border-color:var(--acc);background:#fff}
input:disabled{color:var(--sub);background:var(--gray-soft)}
textarea{min-height:84px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px;background:var(--gray-soft);color:var(--ink)}
.btn.primary{background:var(--acc);color:#fff}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.soft{background:var(--acc-soft);color:var(--acc-ink)}
.btn:disabled{opacity:.5}
.btn+.btn{margin-top:8px}
.btns{display:flex;gap:8px;margin-top:16px}.btns .btn{margin:0;flex:1;width:auto;min-width:0}
.btns .btn.grow{flex:2}
.link{color:var(--acc-ink);font-size:14px;padding:8px 2px;font-weight:600}
.mini{padding:8px 14px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.mini.ghost{background:var(--acc-soft);color:var(--acc-ink)}
.act{min-width:76px;height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none;white-space:nowrap}
.act.go{background:var(--acc);color:#fff}
.act.c-green{background:var(--green-soft);color:var(--green)}.act.c-blue{background:var(--blue-soft);color:var(--blue)}
.act.c-orange{background:var(--orange-soft);color:var(--orange)}.act.c-red{background:var(--red-soft);color:var(--red)}.act.c-gray{background:var(--gray-soft);color:var(--gray)}
.act svg{width:16px;height:16px}
.avatar.c-green{background:var(--green-soft);color:var(--green)}.avatar.c-blue{background:var(--blue-soft);color:var(--blue)}
.avatar.c-orange{background:var(--orange-soft);color:var(--orange)}.avatar.c-red{background:var(--red-soft);color:var(--red)}.avatar.c-gray{background:var(--gray-soft);color:var(--gray)}
.avatar svg{width:20px;height:20px}
.slot{font-size:11px;font-weight:700;color:var(--sub);background:var(--gray-soft);border-radius:6px;padding:1px 6px;margin-left:2px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;vertical-align:1px}
.c-green{background:var(--green-soft);color:var(--green)}.c-blue{background:var(--blue-soft);color:var(--blue)}
.c-orange{background:var(--orange-soft);color:var(--orange)}.c-red{background:var(--red-soft);color:var(--red)}
.c-gray{background:var(--gray-soft);color:var(--gray)}.c-acc{background:var(--acc-soft);color:var(--acc-ink)}
/* rows */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .meta{color:var(--sub);font-size:13px;margin-top:1px}
.row .note{margin-top:6px;font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;flex:none}
.avatar.off{background:var(--gray-soft);color:var(--gray)}
.chev{color:var(--faint);font-size:20px}
.empty{text-align:center;color:var(--sub);padding:32px 16px}
/* alerts */
.alert{border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.alert.red{background:var(--red-soft)}.alert.orange{background:var(--orange-soft)}.alert.acc{background:var(--acc-soft)}
.alert .t{font-weight:800;margin-bottom:6px}
.alert.red .t{color:var(--red)}.alert.orange .t{color:var(--orange)}.alert.acc .t{color:var(--acc-ink)}
.alert .ar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(0,0,0,.05)}
.alert .ar:first-of-type{border-top:0}
.alert .ar span{font-size:14px}
/* date nav */
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dnav input{flex:1;text-align:center;font-weight:700;background:var(--card);border:0;padding:11px}
.icbtn{width:44px;height:44px;border-radius:12px;background:var(--card);font-size:18px;color:var(--sub);flex:none}
.txtbtn{height:44px;padding:0 14px;border-radius:12px;background:var(--card);font-weight:700;color:var(--acc-ink);flex:none}
/* hero */
.hero{text-align:center;padding:22px 16px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.hero .big small{font-size:18px;font-weight:700;margin-left:2px}
.hero .cap{color:var(--sub);font-size:13px;margin-top:6px}
.dots{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--acc)}
.dot.on{background:var(--acc);color:#fff}
.dot.over{border-color:var(--red);background:var(--red);color:#fff}
.bar{height:8px;background:var(--acc-soft);border-radius:8px;overflow:hidden;margin:14px 0 4px}.bar i{display:block;height:100%;background:var(--acc)}
.code{font:800 30px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;text-align:center;background:var(--acc-soft);color:var(--acc-ink);border-radius:12px;padding:14px;margin:6px 0 10px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font-size:18px;letter-spacing:-.3px}
.stat span{font-size:12px;color:var(--sub)}
.stat.wide{grid-column:1/-1}
.stat.wide b{font-size:24px}
/* segmented */
.seg{display:flex;background:var(--gray-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--sub);font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* status grid */
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stg button{padding:12px 4px;border-radius:12px;font-weight:700;font-size:14px;border:2px solid transparent}
.stg button.sel{border-color:currentColor}
.hint{font-size:13px;color:var(--sub);margin:8px 2px 0}
/* toggle */
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tg:first-of-type{border-top:0}
.tg small{display:block;color:var(--sub);font-size:12px}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:#DCDAE4;position:relative;flex:none;transition:.2s;margin:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--acc)}.sw:checked:after{left:23px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}.kv span:first-child{color:var(--sub)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:center;z-index:5}
.tabs .in{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--faint);position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--acc)}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.back{font-size:16px;font-weight:700;color:var(--acc-ink);padding:6px 0}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,18,32,.4);animation:fade .2s}
.sheet-body{position:relative;background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--safe-b));max-height:90vh;overflow:auto;animation:up .22s ease-out}
.sheet-body:before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet-body h3{margin:0 0 4px;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,20px);background:#1E1B2E;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* login */
.brand{text-align:center;padding:40px 0 24px}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(140deg,#7C5CF0,#5A3CCB);margin:0 auto 14px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(106,75,224,.3)}
.logo svg{width:40px;height:40px}
.brand h1{margin:0;font-size:26px}
.brand p{margin:4px 0 0;color:var(--sub)}
.hello{background:var(--acc-soft);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.demo{border:1.5px dashed #C9BFF5;background:#FAF8FF}
.check-big{display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px}
.check-big .l{font-size:19px;font-weight:800}.check-big .s{font-size:13px;opacity:.85;font-weight:600}
.done-box{text-align:center;padding:18px;border-radius:var(--r);background:var(--green-soft);color:var(--green);font-weight:800;margin-bottom:12px}
.done-box small{display:block;font-weight:600;color:var(--sub);margin-top:2px}
.spin{display:grid;place-items:center;height:60vh;color:var(--sub)}
</style>
</head>
<body>
<div id="app"><div class="spin">불러오는 중…</div></div>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script type="module">
/* ============================================================
   레슨 출석 — 설정
   Firebase 설정은 config.js 파일에 따로 둔다 (앱을 고쳐 올려도 다시 붙여 넣을 필요 없음)
   ADMIN_EMAILS: 원장(수정 권한) 계정 이메일. 보안 규칙의 목록과 똑같이
   config.js가 없거나 비어 있으면 '데모 모드'(이 기기에만 저장)로 동작
   ============================================================ */
const FIREBASE_CONFIG = window.ATTEND_FIREBASE_CONFIG || null;
const ADMIN_EMAILS = ['jin@naver.com', 'deuk@naver.com'];  // 보안 규칙의 목록과 똑같이
const FB_VER = '13.2.0';
const ROOT = 'apps/attend';              // Firestore 안에서 이 앱의 자리 (#01의 schedules와 안 겹침)
const LOGIN_DOMAIN = 'lesson-attend.app'; // 레슨생 계정용 가상 이메일 도메인 (메일은 안 보냄)
const APP_VER = '1.4.1';
const SCHED_DOC = ['schedules', 'main']; // #01 레슨 시간표 문서
const CLOUD = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !/여기/.test(FIREBASE_CONFIG.apiKey));

/* ---------- 작은 도구 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const DOW = '일월화수목금토';
const fmtD = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
const fmtS = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return `${d.getMonth()+1}.${d.getDate()} (${DOW[d.getDay()]})`; };
const ymOf = s => s.slice(0, 7);
const fmtYM = ym => `${ym.slice(0,4)}년 ${+ym.slice(5)}월`;
const shiftYM = (ym, n) => { const d = new Date(+ym.slice(0,4), +ym.slice(5) - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';
const ts = v => v == null ? Date.now() : (typeof v === 'number' ? v : (v.toMillis ? v.toMillis() : 0));
const byName = (a, b) => a.name.localeCompare(b.name, 'ko');
// 이름 끝의 '님'은 떼고 쓴다 (시간표에 '김민지님'으로 적혀 있어도 아이디·표시는 '김민지')
const cleanName = s => String(s ?? '').normalize('NFC').trim().replace(/\s+/g, ' ').replace(/\s*님$/, '').trim();
const hexKey = s => 'n' + Array.from(new TextEncoder().encode(s), b => b.toString(16).padStart(2, '0')).join('');
const nameKey = s => hexKey(cleanName(s).replace(/\s+/g, ''));
const legacyKeys = s => { const raw = String(s || '').normalize('NFC').replace(/\s+/g, ''); return [hexKey(raw), hexKey(raw + '님')]; }; // v1.2 이전 가입자용
const CODE_CH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => CODE_CH[b % CODE_CH.length]).join('');
const codeEmail = code => `a-${code.toLowerCase()}@${LOGIN_DOMAIN}`;
const localId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- 상태 ---------- */
const DEF_SETTINGS = { passSize: 4, price: 0, deductAbsent: true, deductLate: true };
const S = {
  ready: false, user: null, role: null, sid: null, err: '',
  settings: { ...DEF_SETTINGS }, students: {}, records: {}, passes: {},
  tab: 'today', date: today(), month: ymOf(today()), view: null, showEnded: false,
  sched: null, loaded: {}, todayMode: 'day',
  loginTab: 'login', invite: null, signingUp: false,
};
const ST = {
  present: { t: '출석',     c: 'green'  },
  makeup:  { t: '보강',     c: 'blue'   },
  late:    { t: '당일취소', c: 'orange' },
  absent:  { t: '결석',     c: 'red'    },
  cancel:  { t: '미리취소', c: 'gray'   },
};
const deducts = st => st === 'present' || st === 'makeup' || (st === 'absent' && S.settings.deductAbsent) || (st === 'late' && S.settings.deductLate);
const stHint = st => deducts(st) ? '수강권 1회가 차감돼요' : '차감되지 않아요';

/* ---------- 수강권 계산 (저장은 최소로, 남은 횟수는 매번 계산) ---------- */
// 결제한 순서대로 수강권을 늘어놓고, 차감되는 기록을 날짜 순서대로 채워 넣는다.
// 그래서 결제일이 사람마다 달라도, 원장이 기록을 고쳐도 자동으로 맞는다.
function ledger(sid) {
  const passes = Object.values(S.passes).filter(p => p.sid === sid)
    .sort((a, b) => (a.paidAt || '').localeCompare(b.paidAt || '') || ts(a.createdAt) - ts(b.createdAt))
    .map(p => ({ ...p, total: Math.max(0, +p.total || 0), used: 0 }));
  const recs = Object.values(S.records).filter(r => r.sid === sid)
    .sort((a, b) => a.date.localeCompare(b.date) || ts(a.createdAt) - ts(b.createdAt));
  const tag = {}; let pi = 0, used = 0;
  for (const r of recs) {
    if (!deducts(r.status)) { tag[r.id] = { kind: 'free' }; continue; }
    used++;
    while (pi < passes.length && passes[pi].used >= passes[pi].total) pi++;
    if (pi < passes.length) { passes[pi].used++; tag[r.id] = { kind: 'pass', n: passes[pi].used, total: passes[pi].total }; }
    else tag[r.id] = { kind: 'unpaid' };
  }
  const total = passes.reduce((a, p) => a + p.total, 0);
  const remaining = total - used;
  const cur = passes.find(p => p.used < p.total) || passes[passes.length - 1] || null;
  return { passes, recs, tag, total, used, remaining, unpaid: Math.max(0, used - total), cur,
           needPay: remaining <= 0, last: remaining === 1 };
}
function remainText(L) {
  if (!L.passes.length && !L.used) return '수강권 없음';
  if (L.unpaid > 0) return `미결제 ${L.unpaid}회`;
  if (L.remaining <= 0) return '수강권 다 씀';
  return `${L.remaining}회 남음`;
}
function summary(L) {
  return L.cur ? `${L.cur.used}/${L.cur.total}회 · ${remainText(L)}` : remainText(L);
}
function badges(L, s) {
  let h = '';
  if (s && s.active === false) h += '<span class="pill c-gray">수강 종료</span>';
  else if (L.needPay) h += '<span class="pill c-red">결제 필요</span>';
  else if (L.last) h += '<span class="pill c-orange">마지막 1회</span>';
  return h;
}
function tagText(t) {
  if (!t) return '';
  if (t.kind === 'pass') return `${t.n}/${t.total}회차`;
  if (t.kind === 'unpaid') return '미결제 회차';
  return '차감 없음';
}
function dotsHTML(L) {
  const c = L.cur;
  if (!c) return '';
  if (c.total > 12) return `<div class="bar"><i style="width:${Math.min(100, c.used / c.total * 100)}%"></i></div>`;
  let h = '<div class="dots">';
  for (let i = 1; i <= c.total; i++) h += `<span class="dot ${i <= c.used ? 'on' : ''}">${i}</span>`;
  for (let i = 1; i <= Math.min(L.unpaid, 4); i++) h += `<span class="dot over">!</span>`;
  return h + '</div>';
}

/* ---------- #01 시간표 명단 → 출석 앱 레슨생 자동 동기화 ----------
   - 시간표에 새 수강생이 생기면 레슨생 + 초대코드를 자동으로 만든다 (수강권은 원장이 결제 확인으로)
   - 시간표 수강생 id를 schedId로 저장해 연결. 이미 같은 이름이 있으면 새로 만들지 않고 연결만
   - 가입 전이면 시간표에서 바꾼 이름도 따라감 (가입 후엔 이름 = 아이디라 고정)
   - 시간표에서 지워지면 삭제하지 않고 '시간표에 없음' 표시 (남은 수강권·기록 보호)
   - 출석 앱에서 삭제한 사람은 syncSkip에 적어 두고 다시 가져오지 않음 */
/* ---------- 시간표 읽기 도우미 ----------
   #01 레슨: { sid, day(0=월), hour, cycle, date? }
   cycle: weekly(매주) / day(주간 근무 주) / night(야간 근무 주) / once(보강, date) / consult(상담 등 일회성) */
const RECURRING = c => !c || c === 'weekly' || c === 'day' || c === 'night';
const mondayOf = ds => { const x = new Date(ds + 'T00:00:00'); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
function shiftOf(st, date) { // 그 주의 근무: 'day' | 'night' | null(모름)
  if (!st || !st.ref || (st.refShift !== 'day' && st.refShift !== 'night')) return null;
  const w = Math.round((mondayOf(date) - mondayOf(st.ref)) / (7 * 864e5));
  if (!isFinite(w)) return null;
  return Math.abs(w) % 2 === 0 ? st.refShift : (st.refShift === 'day' ? 'night' : 'day');
}
function schedOn(date) { // Map(시간표 수강생 id → 그날 레슨[]) · 시간표가 없으면 null
  const sc = S.sched;
  if (!sc || !Array.isArray(sc.lessons)) return null;
  const dow = (new Date(date + 'T00:00:00').getDay() + 6) % 7;
  const studs = new Map((sc.students || []).filter(Boolean).map(x => [String(x.id), x]));
  const out = new Map();
  for (const l of sc.lessons) {
    if (!l || l.sid == null) continue;
    const c = l.cycle || 'weekly';
    let ok = false;
    if (c === 'once') ok = l.date === date;
    else if (c === 'weekly') ok = +l.day === dow;
    else if (c === 'day' || c === 'night') { const sh = shiftOf(studs.get(String(l.sid)), date); ok = +l.day === dow && (sh == null || sh === c); }
    if (!ok) continue;
    const k = String(l.sid);
    if (!out.has(k)) out.set(k, []);
    out.get(k).push(l);
  }
  for (const v of out.values()) v.sort((a, b) => hourNum(a.hour) - hourNum(b.hour));
  return out;
}
const hourNum = h => { if (typeof h === 'number') return h; const m = String(h ?? '').match(/(\d+)(?::(\d+))?/); return m ? +m[1] + (+m[2] || 0) / 60 : 99; };
const fmtHour = h => { if (h == null || h === '') return ''; if (typeof h !== 'number') return String(h); const H = Math.floor(h), M = Math.round((h - H) * 60); return `${H}:${pad(M)}`; };

let syncBusy = false, syncAgain = false;
async function syncFromSchedule() {
  if (S.role !== 'admin' || !S.sched || !S.loaded.students || !S.loaded.settings || S.settings.syncSchedule === false) return;
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true;
  let added = 0;
  try {
    const skip = new Set((S.settings.syncSkip || []).map(String));
    // 정규 레슨(매주·주간·야간)이 있는 수강생만. 상담·녹음 상담·보강만 있는 사람은 일회성이라 안 가져옴
    const lessons = Array.isArray(S.sched.lessons) ? S.sched.lessons : null;
    const regular = lessons ? new Set(lessons.filter(l => l && l.sid != null && RECURRING(l.cycle)).map(l => String(l.sid))) : null;
    const list = (Array.isArray(S.sched.students) ? S.sched.students : [])
      .filter(x => x && x.id != null && cleanName(x.name) && (!regular || regular.has(String(x.id))));
    const ids = new Set(list.map(x => String(x.id)));
    for (const x of list) {
      const schedId = String(x.id), nm = cleanName(x.name);
      if (skip.has(schedId)) continue;
      const all = Object.values(S.students);
      let s = all.find(a => a.schedId === schedId);
      if (!s) {
        s = all.find(a => !a.schedId && a.loginKey === nameKey(nm));
        if (s) { await put('students', s.id, { schedId, schedGone: false }); continue; }
        await createStudent({ name: uniqueName(nm), memo: '', schedId });
        added++; continue;
      }
      const patch = {};
      if (s.schedGone) patch.schedGone = false;
      if (!s.uid && (s.name !== nm || s.loginKey !== nameKey(nm)) && !all.some(a => a.id !== s.id && a.loginKey === nameKey(nm))) {
        patch.name = nm; patch.loginKey = nameKey(nm);
        if (CLOUD && s.code) await fb.setDoc(fb.doc(db, ROOT, 'invites', s.code), { name: nm }, { merge: true });
      }
      if (Object.keys(patch).length) await put('students', s.id, patch);
    }
    const canTrim = lessons && lessons.length > 0; // 시간표를 제대로 읽었을 때만 정리
    for (const a of Object.values(S.students)) {
      if (!a.schedId || ids.has(a.schedId)) continue;
      const used = a.uid || Object.values(S.records).some(r => r.sid === a.id) || Object.values(S.passes).some(p => p.sid === a.id);
      if (canTrim && !used) { await cloudDel('invites', a.code); await del('students', a.id); continue; } // 자동으로 들어왔다가 쓴 적 없는 사람(상담만 등)은 정리
      if (!a.schedGone) await put('students', a.id, { schedGone: true });
    }
  } catch (e) { console.error(e); toast('시간표 명단 가져오기 실패: ' + errMsg(e)); }
  finally { syncBusy = false; }
  if (added) toast(`시간표에서 레슨생 ${added}명을 가져왔어요`);
  if (syncAgain) { syncAgain = false; syncFromSchedule(); }
}
function uniqueName(nm) {
  let n = nm, i = 2;
  while (Object.values(S.students).some(a => a.loginKey === nameKey(n))) n = nm + i++;
  return n;
}
// 가입 전 레슨생의 초대코드 문서가 빠져 있으면 다시 만든다 (원장 앱이 열릴 때마다 한 번씩 점검)
const inviteChecked = new Set();
async function ensureInvites() {
  for (const s of Object.values(S.students)) {
    if (s.uid || !s.code || inviteChecked.has(s.code)) continue;
    inviteChecked.add(s.code);
    try {
      const email = s.email || codeEmail(s.code);
      if (!s.email) await fb.updateDoc(fb.doc(db, ROOT, 'students', s.id), { email });
      const d = await fb.getDoc(fb.doc(db, ROOT, 'invites', s.code));
      const want = { sid: s.id, name: cleanName(s.name), email };
      const cur = d.exists() ? d.data() : null;
      if (!cur || cur.sid !== want.sid || cur.name !== want.name || cur.email !== want.email)
        await fb.setDoc(fb.doc(db, ROOT, 'invites', s.code), want);
    } catch (e) { console.error('invite check', s.code, e); inviteChecked.delete(s.code); }
  }
}

  for (const s of Object.values(S.students)) if (s.uid && s.code && !cleaned.has(s.id)) {
    cleaned.add(s.id); cloudDel('invites', s.code); fb.updateDoc(fb.doc(db, ROOT, 'students', s.id), { code: null }).catch(() => {});

}

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
/* 하루에 레슨이 여러 번(보강 + 정규 등)이면 레슨마다 한 줄씩, 출석도 따로.
   기록의 slot = 시간표 레슨 id. slot 없는 기록(레슨생 본인 체크 등)은 빈 레슨에 시간 순서대로 채운다 */
function slotsOf(s, ls, rs) {
  const used = new Set(), out = ls.map(l => ({ l, r: null }));
  for (const o of out) { const r = rs.find(x => !used.has(x.id) && x.slot === String(o.l.id)); if (r) { o.r = r; used.add(r.id); } }
  for (const o of out) if (!o.r) { const r = rs.find(x => !used.has(x.id) && !ls.some(l => String(l.id) === x.slot)); if (r) { o.r = r; used.add(r.id); } }
  for (const r of rs) if (!used.has(r.id)) out.push({ l: null, r });
  if (!out.length) out.push({ l: null, r: null });
  return out;
}
function todayTab(L) {

/* ---------- 동작 ---------- */
async function addRecord(sid, data) {
  const before = ledger(sid).remaining;
  const id = newId('records');
  const rec = { sid, date: data.date, status: data.status, note: data.note || '', by: data.by, createdAt: now() };
  if (data.slot) rec.slot = String(data.slot);
  await put('records', id, rec);
  payNotice(sid, before, before - (deducts(data.status) ? 1 : 0));
}
function lerr(msg) { const e = $('#lerr'); if (e) e.textContent = msg; }
async function doLogin() {
  const id = val('lid'), pw = $('#lpw').value;
  if (!id || !pw) return lerr('아이디와 비밀번호를 입력해 주세요');
  if (!CLOUD) {
    const s = Object.values(S.students).find(x => x.loginKey === nameKey(id) && x.uid);
    if (!s) return lerr('데모에서는 위의 버튼으로 둘러보거나, 가입한 레슨생 이름으로 로그인해 주세요');
    if (s.demoPw && s.demoPw !== pw) return lerr(ERR['auth/invalid-credential']);
    return demoLoginAs('student', s.id);
  }
  let email = id.toLowerCase();
  if (!id.includes('@')) {
    let found = null;
    for (const k of [nameKey(id), ...legacyKeys(id)]) {
      const snap = await fb.getDoc(fb.doc(db, ROOT, 'logins', k));
      if (snap.exists()) { found = snap.data(); break; }
    }
    if (!found) throw { code: 'app/no-user' };
    email = found.email;
  }
  await fb.signInWithEmailAndPassword(auth, email, pw);
}
async function checkCode() {
  const code = val('jcode').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) return lerr('6자리 초대코드를 입력해 주세요');
  if (!CLOUD) {
    const s = Object.values(S.students).find(x => x.code === code && !x.uid);
    if (!s) throw { code: 'app/bad-code' };
    S.invite = { code, sid: s.id, name: s.name }; return render();
  }
  const snap = await fb.getDoc(fb.doc(db, ROOT, 'invites', code));
  if (!snap.exists()) throw { code: 'app/bad-code' };
  S.invite = { code, ...snap.data() }; S.invite.name = cleanName(S.invite.name); render();
}
async function doJoin() {
  const pw = $('#jpw').value, pw2 = $('#jpw2').value;
  if (pw.length < 6) return lerr(ERR['auth/weak-password']);
  if (pw !== pw2) return lerr('비밀번호가 서로 달라요');
  const { sid, name, email } = S.invite;
  if (!CLOUD) {
    await put('students', sid, { uid: 'demo-' + sid, code: null, demoPw: pw });
    S.invite = null; S.loginTab = 'login'; toast('가입 완료! 다음부터는 이름으로 로그인해요');
    return demoLoginAs('student', sid);
  }
  S.signingUp = true;
  try {
    const cred = await fb.createUserWithEmailAndPassword(auth, email, pw);
    const uid = cred.user.uid;
    await fb.setDoc(fb.doc(db, ROOT, 'users', uid), { sid, name, createdAt: fb.serverTimestamp() });
    await fb.updateDoc(fb.doc(db, ROOT, 'students', sid), { uid });
    await fb.setDoc(fb.doc(db, ROOT, 'logins', nameKey(name)), { email, sid });
    S.invite = null; S.loginTab = 'login';
    toast('가입 완료! 다음부터는 이름으로 로그인해요');
  } finally { S.signingUp = false; }
  await startSession(auth.currentUser);
}
function inviteText(s) {
  const url = location.origin + location.pathname;
  return `[레슨 출석] ${s.name} 초대코드: ${s.code}\n\n1) ${url} 열기\n2) "초대코드로 가입" → 코드 입력\n3) 비밀번호만 정하면 끝! (아이디는 "${s.name}")\n\n아이폰은 Safari 공유 버튼 → "홈 화면에 추가"하면 앱처럼 쓸 수 있어요.`;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('복사했어요'); }
  catch { prompt('아래 내용을 복사해 주세요', t); }
}
async function createStudent({ name, memo = '', schedId = null, firstPass = false }) {
  const id = newId('students'), code = genCode(), email = codeEmail(code);
  await cloudSet('invites', code, { sid: id, name, email });
  const data = { name, memo, loginKey: nameKey(name), code, email, uid: null, active: true, createdAt: now() };
  if (schedId) { data.schedId = schedId; data.schedGone = false; }
  await put('students', id, data);
  if (firstPass) await put('passes', newId('passes'), { sid: id, paidAt: today(), total: S.settings.passSize, amount: S.settings.price || 0, memo: '', createdAt: now() });
  return id;
}
async function saveStudent() {
  const sid = SH.sid, s = sid ? S.students[sid] : null;
  const name = s?.uid ? s.name : cleanName(val('sname')), memo = val('smemo');
  const se = $('#serr');
  if (!name) { se.textContent = '이름을 입력해 주세요'; return; }
  const key = nameKey(name);
  if (Object.values(S.students).some(x => x.id !== sid && x.loginKey === key)) { se.textContent = '같은 이름이 있어요. 구분되게 적어 주세요 (예: 김민지B)'; return; }
  if (s) {
    const patch = { memo };
    if (!s.uid && (name !== s.name || s.loginKey !== key)) { patch.name = name; patch.loginKey = key; if (CLOUD && s.code) await fb.setDoc(fb.doc(db, ROOT, 'invites', s.code), { name }, { merge: true }); }
    await put('students', sid, patch); closeSheet(); toast('저장했어요'); return;
  }
  const id = await createStudent({ name, memo, firstPass: $('#sfirst')?.checked });
  closeSheet(); S.tab = 'students'; S.view = id; render(); scrollTo(0, 0);
  toast('추가했어요 · 초대코드를 보내 주세요');
}
async function reissue(sid) {
  const s = S.students[sid];
  if (!(await ask(`${s.name}의 새 초대코드를 만들까요?\n\n지금 계정으로는 더 이상 로그인할 수 없고, 새 코드로 다시 가입해서 비밀번호를 정하면 돼요. 출석·결제 기록은 그대로예요.`, '확인', true))) return;
  const code = genCode(), email = codeEmail(code);
  if (CLOUD) {
    await cloudDel('invites', s.code);
    await cloudDel('users', s.uid);
    await cloudDel('logins', s.loginKey);
    await cloudSet('invites', code, { sid, name: s.name, email });
    cleaned.delete(sid);
  }
  await put('students', sid, { code, email, uid: null, demoPw: null });
  toast('새 초대코드를 만들었어요');
}
async function delStudent(sid) {
  const s = S.students[sid];
  if (!(await ask(`${s.name}의 정보와 출석·결제 기록을 모두 삭제할까요?\n되돌릴 수 없어요. 그만둔 거라면 "수강 종료로 표시"를 추천해요.${s.schedId ? '\n\n시간표에 남아 있어도 다시 가져오지 않아요.' : ''}`, '확인', true))) return;
  for (const r of Object.values(S.records).filter(r => r.sid === sid)) await del('records', r.id);
  for (const p of Object.values(S.passes).filter(p => p.sid === sid)) await del('passes', p.id);
  if (CLOUD) { await cloudDel('invites', s.code); await cloudDel('users', s.uid); await cloudDel('logins', s.loginKey); }
  if (s.schedId) await saveSettings({ syncSkip: [...new Set([...(S.settings.syncSkip || []), s.schedId])] });
  await del('students', sid);
  S.view = null; render(); toast('삭제했어요');
}
async function exportData() {
  const clean = Object.fromEntries(Object.entries(S.students).map(([k, v]) => { const { demoPw, ...r } = v; return [k, r]; }));
  const fix = o => JSON.parse(JSON.stringify(o, (k, v) => (v && typeof v === 'object' && 'seconds' in v && 'nanoseconds' in v) ? new Date(v.seconds * 1000).toISOString() : v));
  const data = fix({ app: 'lesson-attend', version: APP_VER, exportedAt: new Date().toISOString(), settings: S.settings, students: clean, records: S.records, passes: S.passes });
  const name = `레슨출석_백업_${today()}.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const ACT = {
  closeSheet: () => { const r = SH._ask; closeSheet(); if (r) { delete SH._ask; r(false); } },
  askYes: () => { const r = SH._ask; delete SH._ask; closeSheet(); r && r(true); },
  askNo: () => { const r = SH._ask; delete SH._ask; closeSheet(); r && r(false); },
  ltab: d => { S.loginTab = d.v; S.invite = null; render(); },
  login: doLogin,
  checkCode, join: doJoin,
  resetCode: () => { S.invite = null; render(); },
  forgot: async () => {
    const id = val('lid');
    if (CLOUD && id.includes('@')) { await fb.sendPasswordResetEmail(auth, id); return lerr('비밀번호 재설정 메일을 보냈어요'); }
    lerr('레슨생은 원장쌤께 새 초대코드를 받아 다시 가입하면 돼요 (기록은 그대로). 원장님은 이메일을 적고 다시 눌러 주세요.');
  },
  demoAdmin: () => demoLoginAs('admin'),
  demoStudent: d => demoLoginAs('student', d.sid),
  logout: async () => {
    if (!CLOUD) { try { localStorage.removeItem(LS_SESS); } catch {} S.role = null; S.sid = null; S.user = null; S.tab = 'today'; render(); scrollTo(0, 0); return; }
    if (await ask('로그아웃할까요?', '로그아웃')) await fb.signOut(auth);
  },
  tab: d => { if (S.tab === d.v && S.view) S.view = null; S.tab = d.v; if (d.v !== 'students') S.view = null; render(); scrollTo(0, 0); },
  dateShift: d => { S.date = addDays(S.date, +d.n); S.todayMode = 'day'; render(); },
  dateToday: () => { S.date = today(); S.todayMode = 'day'; render(); },
  todayMode: d => { S.todayMode = d.v; render(); },
  monthShift: d => { S.month = shiftYM(S.month, +d.n); render(); },
  openStudent: d => { S.tab = 'students'; S.view = d.sid; render(); scrollTo(0, 0); },
  back: () => { S.view = null; render(); },
  toggleEnded: () => { S.showEnded = !S.showEnded; render(); },
  quick: async d => { await addRecord(d.sid, { date: S.date, status: d.mk ? 'makeup' : 'present', by: 'admin', slot: d.slot }); },
  openRec: d => recSheet(d.sid, d.new ? null : d.rid, d.new ? '' : d.slot, !!d.mk),
  pickSt: (d, b) => { SH.st = d.v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); $('#sthint').textContent = stHint(d.v); },
  saveRec: async () => {
    const { sid, rid, st, slot } = SH, date = val('rdate'), note = val('rnote');
    if (!date) return toast('날짜를 골라 주세요');
    if (!rid) { closeSheet(); return addRecord(sid, { date, status: st, note, by: 'admin', slot: date === S.date ? slot : '' }); }
    const old = S.records[rid], before = ledger(sid).remaining;
    await put('records', rid, { date, status: st, note });  // slot은 그대로
    closeSheet(); toast('저장했어요');
    payNotice(sid, before, before - (deducts(st) ? 1 : 0) + (deducts(old.status) ? 1 : 0));
  },
  delRec: async () => { if (!(await ask('이 기록을 삭제할까요?', '확인', true))) return; await del('records', SH.rid); closeSheet(); toast('삭제했어요'); },
  openPay: d => paySheet(d.sid, d.pid),
  savePay: async () => {
    const { sid, pid } = SH, paidAt = val('pdate'), total = Math.round(+val('ptotal')), amount = Math.round(+val('pamt') || 0), memo = val('pmemo');
    if (!paidAt || !(total > 0)) return toast('결제일과 횟수를 확인해 주세요');
    if (pid) await put('passes', pid, { paidAt, total, amount, memo });
    else await put('passes', newId('passes'), { sid, paidAt, total, amount, memo, createdAt: now() });
    closeSheet(); toast(pid ? '저장했어요' : `${S.students[sid]?.name} · ${total}회 수강권 시작!`);
  },
  delPay: async () => { if (!(await ask('이 결제 기록을 삭제할까요?\n남은 횟수가 다시 계산돼요.', '확인', true))) return; await del('passes', SH.pid); closeSheet(); toast('삭제했어요'); },
  addStudent: () => studentSheet(null),
  editInfo: d => studentSheet(d.sid),
  saveStudent,
  shareInvite: async d => {
    const t = inviteText(S.students[d.sid]);
    if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    copyText(t);
  },
  copyCode: d => copyText(S.students[d.sid].code),
  reissue: d => reissue(d.sid),
  toggleActive: async d => { const s = S.students[d.sid]; await put('students', d.sid, { active: s.active === false }); toast(s.active === false ? '다시 수강 중으로 바꿨어요' : '수강 종료로 표시했어요'); },
  delStudent: d => delStudent(d.sid),
  exportData,
  clearSkip: async () => { await saveSettings({ syncSkip: [] }); syncFromSchedule(); },
  demoReset: async () => { if (!(await ask('데모 데이터를 처음 상태로 되돌릴까요?', '확인', true))) return; demoSeed(); render(); toast('처음 상태로 돌렸어요'); },
  checkin: () => {
    const L = ledger(S.sid), willDeduct = L.remaining;
    openSheet(`
      <h3>오늘 출석할까요?</h3>
      <p class="muted">${fmtD(today())}</p>
      ${L.passes.length ? `<div class="card" style="background:var(--bg);text-align:center;margin:12px 0 0"><span class="muted">남은 횟수</span><div style="font-size:24px;font-weight:800">${Math.max(0, willDeduct)}회 → <span style="color:${willDeduct - 1 <= 0 ? 'var(--red)' : 'var(--acc)'}">${Math.max(0, willDeduct - 1)}회</span></div></div>` : ''}
      ${willDeduct - 1 <= 0 ? '<p class="hint" style="color:var(--red)">이번 출석으로 수강권을 다 써요. 원장쌤께 연장 결제를 말씀해 주세요.</p>' : ''}
      <div class="btns"><button class="btn" data-act="closeSheet">취소</button><button class="btn primary grow" data-act="doCheckin">출석하기</button></div>`);
  },
  doCheckin: async () => {
    if (ledger(S.sid).recs.some(r => r.date === today())) { closeSheet(); return toast('오늘은 이미 기록돼 있어요'); }
    closeSheet();
    const id = newId('records');
    await put('records', id, { sid: S.sid, date: today(), status: 'present', by: 'student', note: '', createdAt: now() });
    toast('출석했어요! 오늘도 화이팅 🎤');
  },
};
const CH = {
  date: t => { if (t.value) { S.date = t.value; render(); } },
  passSize: t => { const n = Math.round(+t.value); if (n > 0) saveSettings({ passSize: n }); },
  price: t => saveSettings({ price: Math.max(0, Math.round(+t.value || 0)) }),
  deductLate: t => saveSettings({ deductLate: t.checked }),
  syncSchedule: async t => { await saveSettings({ syncSchedule: t.checked }); if (t.checked) syncFromSchedule(); },
  deductAbsent: t => saveSettings({ deductAbsent: t.checked }),
};

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault();
  if (b.tagName === 'BUTTON') b.disabled = true;
  try { await f(b.dataset, b, e); }
  catch (err) { console.error(err); if ($('#lerr') && !S.role) lerr(errMsg(err)); else toast(errMsg(err)); }
  finally { if (b.isConnected) b.disabled = false; }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.ch && CH[t.dataset.ch]) CH[t.dataset.ch](t); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  const id = e.target.id;
  if (id === 'lpw' || id === 'lid') ACT.login().catch(err => lerr(errMsg(err)));
  else if (id === 'jcode') checkCode().catch(err => lerr(errMsg(err)));
});
// 날짜가 바뀐 채로 앱을 다시 열면 '오늘'을 새로
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.role) { const t = today(); if (S._lastDay && S._lastDay !== t && S.date === S._lastDay) S.date = t; S._lastDay = t; scheduleRender(); } });
S._lastDay = today();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (CLOUD) initCloud().catch(e => { S.ready = true; S.role = 'none'; S.err = 'Firebase 연결 실패: ' + errMsg(e); render(); });
else initDemo();
if (!CLOUD) window.__attend = { S, syncFromSchedule, demoLoginAs };
</script>
</body>
</html>
